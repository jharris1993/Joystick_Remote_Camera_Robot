# File gopigo3.conf
# 2026-11-11 by Jim Harris for Joystick_Camera_Robot
# Install at /etc/nginx/sites-available
# Copy a symlink to /etc/nginx/sites-available
# and make sure there's nothing else in the folder.
#
#server {
#   listen gopigo3.com:80;
#   server_name gopigo3.com;
#   return 301 https://gopigo3.com$request_uri;
# }

# This is the "web" server (command and control), running Flask/Werkzeug
# that must be passed through as a secure connection so that the
# joystick/gamepad works.
#
# TLS terminates at nginx. The internal Flask/Werkzeug server uses
# an ordinary HTTP connection on port 5000.
#
server {
   listen 443 ssl;
   server_name gopigo3.com;
   ssl_certificate  /usr/local/share/ca-certificates/extra/gopigo3.crt;
   ssl_certificate_key  /usr/local/share/ca-certificates/extra/gopigo3.key;
   ssl_prefer_server_ciphers on;

   location / {
        proxy_pass http://gopigo3.com:5000;

        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
   }
}

# This is the video streaming port/server running streamserver
# which is not, and cannot be, secured. However, since most
# modern browsers will not mix insecure and secure content on
# the same page, the outward-facing connection must be secure.
#
server {
   listen 5001 ssl;
   server_name gopigo3.com;
   ssl_certificate  /usr/local/share/ca-certificates/extra/gopigo3.crt;
   ssl_certificate_key  /usr/local/share/ca-certificates/extra/gopigo3.key;
   ssl_prefer_server_ciphers on;

# After securing the outward-facing connection, pass it through
# as an insecure connection so streamserver doesn't barf.

   location / {
        proxy_pass http://gopigo3.com:5002;

        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
   }
}
